<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Last Mile logo">
  <rect width="512" height="512" rx="112" fill="#1E2B33"/>
  <!-- Metro line arriving at the station -->
  <path d="M64 330 H196" stroke="#14A3B8" stroke-width="40" stroke-linecap="round" fill="none"/>
  <!-- Shuttle loop: station to office -->
  <path d="M196 330 C 250 330, 262 196, 352 188" stroke="#F2B200" stroke-width="40" stroke-linecap="round" fill="none"/>
  <path d="M338 136 L412 186 L342 236 Z" fill="#F2B200"/>
  <!-- Station ring -->
  <circle cx="196" cy="330" r="42" fill="#E6EAEC" stroke="#1E2B33" stroke-width="16"/>
</svg>
